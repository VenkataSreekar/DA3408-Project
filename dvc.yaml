stages:
  fetch:
    cmd: python src/ingestion/fetch_codeforces.py --n-contests 70 --users 1500 
      --out data/raw
    deps:
    - src/ingestion/fetch_codeforces.py
    outs:
    - data/raw:
        persist: true
  features:
    cmd: python src/features/spark_features.py --raw data/raw --out 
      data/processed
    deps:
    - src/features/spark_features.py
    - data/raw
    outs:
    - data/processed/features.parquet
    - data/processed/train_stats.json
    metrics:
    - data/processed/spark_metrics.json:
        cache: false

  train:
    cmd: python src/training/train.py --data data/processed/features.parquet 
      --metrics-out metrics/train_metrics.json
    deps:
    - src/training/train.py
    - data/processed/features.parquet
    metrics:
    - metrics/train_metrics.json:
        cache: false
  export_model:
    cmd: python src/training/export_model.py
    deps:
    - metrics/train_metrics.json
    - src/training/export_model.py
    outs:
    - model
